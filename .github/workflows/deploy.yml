on:
  push:
    branches:
      - master  # Change to your default branch if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add AWS VM to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo 'SSH connection successful'"

      - name: Copy files to AWS VM
        run: |
          rsync -avz \
            --delete \
            --exclude='public' \
            --exclude='storage/app/public' \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Install dependencies & setup app
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          cd ${{ secrets.DEPLOY_PATH }}
            
          # Set correct permissions (only needed once, or when files are replaced)
          find storage -type d -exec chmod 775 {} \;
          find bootstrap/cache -type d -exec chmod 775 {} \;
          find storage -type f -exec chmod 664 {} \;
          find bootstrap/cache -type f -exec chmod 664 {} \;

          # Install composer dependencies
          composer install --no-dev --optimize-autoloader
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          # php artisan migrate --force  # Uncomment if needed
          EOF

      - name: Reload services
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          sudo systemctl reload nginx
          sudo systemctl reload php8.1-fpm
          EOF
